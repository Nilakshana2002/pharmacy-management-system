<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" fill="none">
  <!-- Mark Group -->
  <g transform="translate(10, 10)">
    <!-- Pill Capsule (Angled -40 degrees) -->
    <g transform="rotate(-40 54 58)">
      <!-- Top Half: Outline / White (Rounded Cap) -->
      <path d="M 40 20 C 40 9, 68 9, 68 20 L 68 54 L 40 54 Z" 
            fill="#ffffff" stroke="#164e39" stroke-width="6.5" stroke-linejoin="round" />
      <path d="M 47 24 C 47 17, 61 17, 61 24 L 61 48" 
            stroke="#164e39" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
      
      <!-- Bottom Half: Solid Forest Green (Rounded Cap) -->
      <path d="M 40 54 L 68 54 L 68 88 C 68 99, 40 99, 40 88 Z" 
            fill="#164e39" stroke="#164e39" stroke-width="4" stroke-linejoin="round" />
      <path d="M 46 60 L 46 82 C 46 86, 52 86, 52 82" 
            stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95" />
    </g>

    <!-- Coral Red / Salmon Medical Cross (+) -->
    <g transform="translate(65, 20)">
      <rect x="7" y="0" width="8" height="22" rx="3" fill="#f06d4e" />
      <rect x="0" y="7" width="22" height="8" rx="3" fill="#f06d4e" />
    </g>

    <!-- Radiating Click Spark Lines -->
    <g stroke="#268a84" stroke-width="3.5" stroke-linecap="round">
      <line x1="47" y1="62" x2="42" y2="60" />
      <line x1="49" y1="72" x2="43" y2="74" />
      <line x1="53" y1="80" x2="50" y2="87" />
      <line x1="62" y1="84" x2="62" y2="91" />
    </g>

    <!-- Click Arrow Pointer Cursor -->
    <path d="M 60 67 L 76 89 L 69 91 L 74 103 L 68 105 L 63 93 L 56 97 Z" 
          fill="#268a84" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Typography matching exact brand colors & fonts -->
  <g transform="translate(145, 75)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <tspan fill="#164e39">My </tspan>
      <tspan fill="#268a84">Pharmacist</tspan>
    </text>
    <text y="30" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="14.5" fill="#1e293b" letter-spacing="2">
      MODERN DISPENSARY &amp; HEALTHCARE SYSTEM
    </text>
  </g>
</svg>
